[project]
name = "mgy-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ulf881", email = "jonas14costa@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.3",
    "beautifulsoup4==4.15.0",
    "curl-cffi==0.16.3",
    "discord-py[voice]==2.7.1",
    "google-api-python-client==2.198.0",
    "lxml>=6.1.3",
    "psycopg2==2.9.13",
    "psycopg2-binary==2.9.13",
    "python-dotenv==1.1.1",
    "requests==2.34.2",
    "spotipy==2.26.0",
    "tzdata>=2026.5",
    "yt-dlp-ejs>=0.8.0",
    "yt-dlp[default]>=2026.8.30.232658.dev0",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 200
target-version = "py313"

[tool.ruff.lint]
# Regras pragmaticas: pycodestyle (E/W), pyflakes (F), isort (I).
# Excecoes amplas (BLE001/S110) sao intencionais para chamadas de rede/FFmpeg.
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
