[project]
name = "mgy-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ulf881", email = "jonas14costa@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.3",
    "beautifulsoup4==4.15.0",
    "discord-py[voice]==2.7.1",
    "flask==3.1.3",
    "google-api-python-client==2.198.0",
    "psycopg2==2.9.13",
    "psycopg2-binary==2.9.13",
    "python-dotenv==1.1.1",
    "requests==2.34.2",
    "spotipy==2.26.0",
    "yt-dlp-ejs>=0.8.0",
    "yt-dlp[default]>=2026.8.30.232658.dev0",
]

[project.scripts]
mgy-bot = "mgy_bot:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
